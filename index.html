const $=id=>document.getElementById(id);let queue=[],i=0,selected=null,filled=[],mistakes=new Set(),earned=0,done=false,mode=1;const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function mix(items){let remaining=shuffle(items),out=[];while(remaining.length){let prev=out[out.length-1];let k=remaining.findIndex(x=>!prev||(x.w!==prev.w&&x.c!==prev.c));if(k<0)k=0;out.push(remaining.splice(k,1)[0])}return out}
function start(){queue=mix(words.flatMap(w=>[...w].filter(c=>data[c]).map(c=>({c,w}))));mode=2;begin()}
function begin(){i=0;earned=0;mistakes=new Set();$('setup').hidden=true;$('end').hidden=true;$('game').hidden=false;render()}
const layouts={L:[[0,0,40,100],[40,0,60,100]],T:[[0,0,100,50],[0,50,100,50]],A:[[0,0,100,30],[0,30,100,35],[0,65,100,35]],M:[[0,0,30,100],[30,0,35,100],[65,0,35,100]],B:[[0,0,50,50],[50,0,50,50],[0,50,100,50]],E:[[0,0,100,100],[25,25,50,60]],U:[[0,65,100,35],[25,0,75,65]]};
function render(){let {c,w}=queue[i], [shape,...parts]=data[c];selected=null;filled=parts.map(()=>false);done=false;$('next').disabled=true;$('complete').style.display='none';$('complete').style.backgroundImage='none';$('complete').style.color='';$('ghost').textContent='';$('word').textContent=[...w].map(ch=>ch===c?'□':ch).join('');$('progress').textContent=`第 ${i+1} / ${queue.length} 題`;$('stars').textContent=`⭐ ${earned}`;$('feedback').textContent='把部件放到正確位置';$('slots').innerHTML='';(custom[c]?.[1]||layouts[shape]).forEach((r,k)=>{let b=document.createElement('button');b.className='slot';b.style.cssText=`left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%`;b.setAttribute('aria-label',`位置 ${k+1}`);b.style.fontSize=Math.min(65,r[2]*2.1,r[3]*2.1)+'px';b.dataset.k=k;b.onclick=e=>{let target=slotAt(e.clientX,e.clientY);place(target===null?k:target)};$('slots').append(b)});let pool=parts.slice();if(mode===3)pool.push(...shuffle(['木','口','日','氵','心','女','扌','艹','石'].filter(x=>!parts.includes(x))).slice(0,2));$('tiles').innerHTML='';shuffle(pool).forEach(p=>{let b=document.createElement('button');b.className='tile';b.textContent=p;b.setAttribute("aria-label",p);paintPart(b,p);b.onclick=()=>choose(b);b.onpointerdown=e=>dragStart(e,b);$('tiles').append(b)})}
function choose(b){if(done||b.disabled)return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));selected=b;b.classList.add('selected')}
function dragStart(e,b){if(b.disabled||done)return;choose(b);let x=e.clientX,y=e.clientY,moved=false;const d=$('drag');function move(ev){if(Math.hypot(ev.clientX-x,ev.clientY-y)>7)moved=true;if(moved){d.style.display='block';d.textContent=b.textContent;paintPart(d,b.textContent);d.style.left=ev.clientX+'px';d.style.top=ev.clientY+'px';ev.preventDefault()}}function up(ev){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);d.style.display='none';if(moved){let target=slotAt(ev.clientX,ev.clientY);if(target!==null)place(target)}}function cancel(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);d.style.display='none'}window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel)}
function slotAt(x,y){let candidates=[...$("slots").children].map((b,k)=>({b,k,r:b.getBoundingClientRect()})).filter(({k,r})=>!filled[k]&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom);let match=candidates.find(({k})=>selected&&data[queue[i].c][k+1]===selected.textContent);return (match||candidates.at(-1))?.k??null}
function place(k){if(!selected||done||filled[k])return;let {c,w}=queue[i];if(selected.textContent!==data[c][k+1]){mistakes.add(i);$('feedback').textContent='再試一次，你可以的！';return}let slot=$('slots').children[k];slot.textContent=selected.textContent;paintPart(slot,selected.textContent);slot.classList.add('filled');selected.disabled=true;selected.style.visibility='hidden';selected=null;filled[k]=true;if(filled.every(Boolean)){done=true;earned++;$('stars').textContent=`⭐ ${earned}`;$('complete').textContent=c;if(fullGlyphs[c]){$('complete').style.backgroundImage=`url(${fullGlyphs[c]})`;$('complete').style.color='transparent';}$('complete').style.display='grid';$('word').textContent=w;$('feedback').textContent='太棒了！拼砌成功！';$('next').disabled=false}else $('feedback').textContent='做得好！繼續拼砌。'}
function speak(single=false){if(!('speechSynthesis'in window)){ $('feedback').textContent='此裝置不支援朗讀，請老師協助。';return}let v=speechSynthesis.getVoices().find(v=>/zh[-_]HK|yue/i.test(v.lang));if(!v){$('feedback').textContent='未找到粵語語音，請老師協助朗讀。';return}let u=new SpeechSynthesisUtterance(single?queue[i].c:queue[i].w);u.voice=v;u.lang=v.lang;u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}if('speechSynthesis'in window)speechSynthesis.getVoices();function advance(){if(!done)return;if(++i<queue.length)render();else{$('game').hidden=true;$('end').hidden=false;$('result').textContent=`獲得 ${earned} 顆星星！${mistakes.size?' 有 '+mistakes.size+' 題需要重試。':' 全部獨立完成！'}`;$('retry').hidden=!mistakes.size}}function retry(){queue=mix(queue.filter((_,j)=>mistakes.has(j)));begin()}function home(){$('game').hidden=true;$('end').hidden=true;$('setup').hidden=false}
